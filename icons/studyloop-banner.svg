<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="55%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <radialGradient id="dotA" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>
    <radialGradient id="dotB" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#FBCFE8"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Decorative loop on the left -->
  <g transform="translate(330 320) scale(1.4)">
    <path d="
      M -130 0
      C -130 -80, -45 -80, 0 0
      C 45 80, 130 80, 130 0
      C 130 -80, 45 -80, 0 0
      C -45 80, -130 80, -130 0 Z"
      fill="none" stroke="url(#loop)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-130" cy="0" r="16" fill="url(#dotB)"/>
    <circle cx="130" cy="0" r="16" fill="url(#dotA)"/>
    <circle cx="0" cy="0" r="8" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="4" fill="#7C3AED"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(620 290)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif">
    <text x="0" y="0" font-size="108" font-weight="800" fill="#FFFFFF" letter-spacing="-3">StudyLoop</text>
    <text x="4" y="60" font-size="30" font-weight="500" fill="rgba(255,255,255,0.85)" letter-spacing="0.5">An agentic study platform for AuDHD minds</text>
  </g>
</svg>
