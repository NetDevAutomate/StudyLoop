site_name: StudyLoop
site_description: AuDHD-aware Socratic study toolkit with AI session management
site_url: https://hookey-street-software.github.io/StudyLoop/

theme:
  name: material
  font: false
  logo: images/logo.png
  favicon: images/favicon.png
  palette:
    - scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - toc.follow
    - search.highlight

plugins:
  - search
  - offline
  - privacy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/audhd.css
  - stylesheets/fonts.css

extra_javascript:
  - javascripts/preferences.js

exclude_docs: |
  archive/**
  course-explorer/**
  designs/**
  handoffs/**
  plans/**
  research/**
  brainstorms/**
  explorations/**
  superpowers/plans/**

nav:
  - Home: index.md
  - Getting Started:
    - Setup Guide: setup-guide.md
    - Your First Week: first-week.md
    - Agent Installation: agent-install.md
    - Architecture Overview: architecture.md
    - Current Architecture: architecture/current.md
    - Target Architecture: architecture/target.md
    - pi / omp Harness Integration: architecture/pi-omp-harness-integration.md
  - Learning:
    - Study Plans: study-plans.md
    - Content Pipeline: content-pipeline.md
    - AuDHD Philosophy: audhd-learning-philosophy.md
    - Learning Loop Implementation: audhd-learning-loop-implementation.md
    - Deep Technical Learning Roadmap: audhd-deep-technical-learning-roadmap.md
    - Session Protocol: session-protocol.md
  - Reference:
    - CLI Reference: cli-reference.md
    - CI Workflows: ci.md
    - Obsidian Vault Export: obsidian-export.md
    - System Overview: system-overview.md
    - TUI Guide: tui-guide.md
    - Web UI Guide: web-ui-guide.md
    - Voice Output: voice-output.md
    - AuDHD Framework: audhd-framework.md
    - Socratic Engine: socratic-engine.md
    - Network Bridges: network-bridges.md
    - Ownership Map: ownership.md
    - OpenSpec Framework: openspec.md
    - Repository Standards: standards/repo-standards.md
  - Troubleshooting:
    - General Troubleshooting: troubleshooting.md
    - pi / omp Harnesses: troubleshooting/pi-omp.md
  - Governance:
    - Architecture Decisions: adr/README.md
    - "ADR-0001 Body Double reuses session start": adr/0001-body-double-reuses-session-start-endpoint.md
    - "ADR-0002 Origin-scoped live agent console": adr/0002-origin-scoped-live-agent-console.md
    - "ADR-0003 Body Double exempt from park-first": adr/0003-body-double-exempt-from-park-first-friction.md
    - "ADR-0004 Unmount terminalPanel": adr/0004-retire-terminal-panel-from-body-double.md
    - Audit 2026-05-09: audit/2026_05_09_audit.md
    - Planning 2026-05-09: planning/2026_05_09_planning.md
    - Release Process: release-process.md
  - Contributing: contributing.md
  - Roadmap: roadmap.md
  - MCP Integrations: mcp.md
