site_name: StudyLoop
site_description: A local-first, AuDHD-aware study companion for active learning with AI mentors
site_url: https://www.studyloop.dev/

theme:
  name: material
  font: false
  logo: images/logo.png
  favicon: images/favicon.png
  palette:
    - scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - toc.follow
    - search.highlight

plugins:
  - search
  - offline
  - privacy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/audhd.css
  - stylesheets/fonts.css

extra_javascript:
  - javascripts/preferences.js

# Public documentation contract: new files stay out of the rendered site until
# they are explicitly rooted here and added to nav. Repository history, audits,
# plans, handoffs, ADRs, and agent instructions remain source-only by default.
exclude_docs: |
  **
  !/index.md
  !/first-week.md
  !/setup-guide.md
  !/study-plans.md
  !/web-ui-guide.md
  !/content-pipeline.md
  !/voice-output.md
  !/obsidian-export.md
  !/study-notes-skill.md
  !/second-brain.md
  !/tui-guide.md
  !/agent-install.md
  !/session-memory.md
  !/cli-reference.md
  !/troubleshooting.md
  !/audhd-learning-philosophy.md
  !/roadmap.md
  !/architecture.md
  !/contributing.md
  !/contributor-code-map.md
  !/contributor-testing.md
  !/contributor-modules.md
  !/acceptance-testing.md
  !/contributor-environment.md
  !/contributor-debugging.md
  !/contributor-cli.md
  !/contributor-web.md
  !/contributor-mcp.md
  !/contributor-doctor.md
  !/contributor-harnesses-agents.md
  !/contributor-content.md
  !/contributor-documentation.md
  !/contributor-changelog.md
  !/contributor-pull-requests.md
  !/contributor-issues-prioritisation.md
  !/contributor-ai.md
  !/contributor-conventions.md
  !/contributor-module-index.md
  !/images/**
  !/stylesheets/**
  !/javascripts/**

nav:
  - Home: index.md
  - Start Here:
    - Your First Week: first-week.md
    - Setup Guide: setup-guide.md
  - Study and Review:
    - Study Plans: study-plans.md
    - Web UI Guide: web-ui-guide.md
    - Content Pipeline: content-pipeline.md
    - Voice Output: voice-output.md
    - Obsidian Export: obsidian-export.md
    - Lesson Study Notes: study-notes-skill.md
    - Second Brain: second-brain.md
  - Interfaces:
    - TUI Guide: tui-guide.md
    - Agent Installation: agent-install.md
    - Conversation Memory: session-memory.md
  - Reference:
    - CLI Reference: cli-reference.md
    - Troubleshooting: troubleshooting.md
  - About:
    - AuDHD Learning Philosophy: audhd-learning-philosophy.md
    - Architecture Overview: architecture.md
    - Roadmap: roadmap.md
  - Contribute:
    - Start here:
      - Start Contributing: contributing.md
      - Development Environment: contributor-environment.md
      - Debugging: contributor-debugging.md
    - Make a change:
      - A CLI Command: contributor-cli.md
      - A Web Route and UI: contributor-web.md
      - An MCP Tool: contributor-mcp.md
      - A Doctor Check: contributor-doctor.md
      - Harnesses and Agents: contributor-harnesses-agents.md
      - Content Schemas and Pipeline: contributor-content.md
      - Documentation: contributor-documentation.md
    - Prove it:
      - Testing Cookbook: contributor-testing.md
      - Acceptance Testing: acceptance-testing.md
    - Land it:
      - Changelog Process: contributor-changelog.md
      - Raising a Pull Request: contributor-pull-requests.md
      - Issues and Prioritisation: contributor-issues-prioritisation.md
      - AI Usage: contributor-ai.md
  - Developer Reference:
    - Code Map: contributor-code-map.md
    - Conventions: contributor-conventions.md
  - Proposals (design stage):
    - Optional Modules (Proposal): contributor-modules.md
    - Module Index (Proposal): contributor-module-index.md
