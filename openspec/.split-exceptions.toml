[[moved-body-text]]
spec = "voice-tts"
heading = "load_raw_config expands dotted top-level keys before any consumer reads tts.backend"
ordinal = 3
text = '''This closes a defect (fixed in `a7eabb6`) where two of `doctor/voice.py`'s own repair messages were worded as a flat dotted key (`"Set tts.backend: openvox to enable this check"`) — a user following them literally would write a top-level `tts.backend: openvox` scalar key, which `raw.get("tts", {})` could not see (there was no `"tts"` key, only a literal key named `"tts.backend"`), silently keeping `backend` at its `"kokoro"` default and skipping the `openvox_api` check the hint promised to enable.'''
scenario = "The defect behind the loader-level expansion"
reason = "Defect history (no SHALL): a 502-char non-normative sentence that no fragment can hold under 500 and that split-sentence cannot touch (its pieces would carry no modal). Moved verbatim into a history scenario under the fragment whose SHALL it motivates."

[[moved-body-text]]
