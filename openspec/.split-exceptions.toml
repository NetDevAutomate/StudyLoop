[[split-sentence]]
spec = "health-and-diagnostics"
heading = "doctor names each active-but-unready study plan"
ordinal = 2
new = [
  "It SHALL emit one `warn` row per husk with `name=\"study_plans\"`, `fix_auto=False` (the repair is a conversation with the architect, not a script).",
  "It SHALL emit a message naming the plan id, its title, the exact `ReadinessView.blockers`, and the shared provenance sentence (`husk_provenance`: `This plan's creation stamp predates the readiness gate (<READINESS_GATE_DATE>); the seam cannot tell when it became incomplete` only for a `created` that parses as a date before `READINESS_GATE_DATE`, else `cannot tell how it got that way`), and a `fix_hint` naming both exits: `studyloop plan repair <id>  (or: studyloop plan status <id> paused)`.",
  "The shared provenance sentence SHALL never `hand edit`, never `never judged` — a stamp establishes when the document was created, not what judged it or when it became incomplete; council review 6 F4.",
]
added_tokens = ["It", "SHALL", "emit", ".", "The", "shared", "provenance", "sentence", "SHALL", "."]
reason = "790-char single-SHALL sentence. Sentence 2 repeats the subject+modal+predicate head 'It SHALL emit' (the source has one main verb; a grammatical second sentence needs it — the one addition outside the closed list, declared). Sentence 3 adds only the repeated subject noun phrase 'The shared provenance sentence' and SHALL; the two 'never' clauses keep their object (`hand edit`, `never judged`) and 'not' stays in its stamp clause — polarity counts unchanged. The never-clause now follows the fix_hint clause; otherwise clause order is the source's. Dropped: one ',' and one ';'."

