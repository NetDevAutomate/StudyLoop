# Split exceptions — lane E (plan 7): the module-contract-v1 deltas and e2e-representative-journey.
# Read by scripts/check-openspec-split.py. Every entry is consumed exactly once; `spec` is the
# capability id for a living spec or `changes/module-contract-v1/<capability>` for a delta.
# Lane E rule (ARBITRATION-pass9 §8.2 R6): no `restates-shall` in the deltas — a fragment with no
# scenario gets one from a test (`test-sourced`) or from moved non-normative prose only.

