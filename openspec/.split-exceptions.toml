[[test-sourced]]
spec = "changes/module-contract-v1/drill-runner"
heading = "Disposable cluster — core never touches a cluster it did not create and refuses a name collision"
scenario = "a cluster already carrying the attempt's name is refused, not reused"
test = "packages/studyloop/tests/test_module_cluster.py::test_provision_refuses_a_name_collision_without_creating"
reason = "Fragment holds 'A name collision SHALL be refused, never reused' and 'Core SHALL never use ... a cluster it did not create'; the test plants a cluster with the derived name, asserts ClusterError naming it, that the only kind call was the read-only listing, and that no kubeconfig was written."

[[test-sourced]]
spec = "changes/module-contract-v1/drill-runner"
heading = "Disposable cluster — a failed delete keeps the kubeconfig and any exception after create still tears down"
scenario = "a failed delete keeps the attempt's kubeconfig and names it in the by-hand command"
test = "packages/studyloop/tests/test_module_cluster.py::test_failed_delete_after_a_provable_failed_create_keeps_the_kubeconfig"
reason = "Fragment holds the 'When a delete fails, the attempt's kubeconfig SHALL be kept and the reported command SHALL name it' sentence; the test fails the create after kind wrote the kubeconfig, fails the delete too, and asserts the kubeconfig is still a file and the message carries the exact kind delete command with --kubeconfig."

[[test-sourced]]
spec = "changes/module-contract-v1/drill-runner"
heading = "Disposable cluster — core's own `kind` runs with an allowlisted environment"
scenario = "kind sees the allowlisted variables and nothing else"
test = "packages/studyloop/tests/test_module_cluster.py::test_kind_runs_with_an_allowlisted_environment"
reason = "Fragment holds the allowlisted-environment SHALL; the test plants AWS/GitHub secrets and KUBECONFIG in the parent environment beside Docker, kind, proxy, certificate and locale variables and asserts the fake kind saw the allowlisted set and neither the secrets nor KUBECONFIG."

# ---------------------------------------------------------------------------------------------
# changes/module-contract-v1/optional-modules
# ---------------------------------------------------------------------------------------------

[[split-sentence]]
spec = "changes/module-contract-v1/optional-modules"
heading = "Modules are installed from a local path into an immutable snapshot recorded in a lockfile"
ordinal = 1
old = "`studyloop module add <path>` SHALL first copy the module into a private staging area (regular files only — a symlink, hard link or special file anywhere in the tree is refused by name, never skipped), run `module check` on the staged copy and refuse on any finding, digest the staged copy, and publish it atomically as an immutable snapshot keyed by that digest (an existing snapshot at that digest is re-digested and refused on mismatch); and record `id`, `version`, digest and, when the path is a git checkout, the remote URL and HEAD sha read locally with no fetch, into `modules.lock.json`."
new = [
  "`studyloop module add <path>` SHALL first copy the module into a private staging area (regular files only — a symlink, hard link or special file anywhere in the tree is refused by name, never skipped).",
  "`studyloop module add <path>` SHALL run `module check` on the staged copy and refuse on any finding.",
  "`studyloop module add <path>` SHALL digest the staged copy, and publish it atomically as an immutable snapshot keyed by that digest (an existing snapshot at that digest is re-digested and refused on mismatch).",
  "`studyloop module add <path>` SHALL record `id`, `version`, digest and, when the path is a git checkout, the remote URL and HEAD sha read locally with no fetch, into `modules.lock.json`.",
]
# Each new sentence repeats the subject noun phrase `studyloop module add <path>` and the modal
# SHALL, and ends in a full stop; two commas, one semicolon and one 'and' are dropped at the
# former clause joins. The checker tokenises the subject as the six tokens listed three times.
added_tokens = [
  "`studyloop", "module", "add", "path", "`", "SHALL", ".",
  "`studyloop", "module", "add", "path", "`", "SHALL", ".",
  "`studyloop", "module", "add", "path", "`", "SHALL", ".",
]
reason = "The sentence measures 595 on its own, over the 500 limit, so no fragment could hold it unsplit; it is a delta sentence and so absent from evidence/pass9-long-normative-sentences.txt, which measured living bodies only. Four clauses, one SHALL each, kept in document order: staging and check stay under the original heading, digest/publish and the lockfile record open the next requirement (the three repeated subjects made a staging/check/publish grouping measure 512)."

[[test-sourced]]
spec = "changes/module-contract-v1/optional-modules"
heading = "Re-add replaces the lock entry, list and remove read the lockfile only, and v1 touches no network"
scenario = "re-adding an installed id replaces its entry and drops the orphaned snapshot"
test = "packages/studyloop/tests/test_module_lifecycle.py::test_re_adding_the_same_id_replaces_the_entry_and_drops_the_orphaned_snapshot"
reason = "Fragment holds the re-add SHALL (replace the lock entry, remove the orphaned snapshot, lockfile records the new digest); the test adds a module twice with a content change between, asserts the digests differ, the lockfile lists only the second digest, the first snapshot directory is gone and the second exists."

