# -- Activation is readiness-gated on every entry path (1244) -> 4 fragments, stem 'Readiness gate —'

[[split-sentence]]
spec = "web-ui"
heading = "Activation is readiness-gated on every entry path"
ordinal = 1
new = [
  '''Every Web API write that can leave a study plan in the `active` state — create-with-status, raw-Markdown import, whole-document replacement, status transition, and in-place revision of fields or milestones (including a body that combines a status change with field edits) — SHALL delegate to `PlanApplication.apply` as a single intent.''',
  '''Every Web API write that can leave a study plan in the `active` state SHALL be refused by the seam's single readiness gate when the *resulting* document — the document as it would be saved, after every supplied field is applied — has no mission `why`, no success criteria, or no milestones.''',
]
added_tokens = ["Every", "Web", "API", "write", "that", "can", "leave", "a", "study", "plan", "in", "the", "`active`", "state", "."]
reason = "559-char sentence with two SHALL clauses ('SHALL delegate ... and SHALL be refused ...'). Split at the 'and'; the second sentence repeats the subject noun phrase verbatim (without the parenthetical list of doors, which stays with the first). Only subject, modal (already present) and a full stop were added; 'and' dropped."

