# Pattern note for pass 10: six keyword-less descriptive sentences (indicative mood, no SHALL/MUST,
# not list items, not under a lead-in) could not stay in their SHALL sentence's fragment (the pair
# measures > 500) and cannot become their own fragment (the tool requires SHALL/MUST; inserting a
# modal before a finite verb — "performs" -> "SHALL perform" — is a verb change the inherit-shall
# token rule forbids). The only rule-compliant home is a scenario via moved-body-text, which the
# checker permits for exactly this class (never a SHALL, never a governed list item). Each is listed
# below with its reason; the lane log flags the pattern.

