repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
    exclude: mkdocs.yml
  - id: check-added-large-files
    args:
    - --maxkb=500
  - id: check-merge-conflict
  - id: detect-private-key
  - id: detect-aws-credentials
    args:
    - --allow-missing-credentials
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.5
  hooks:
  - id: ruff
    args:
    - --fix
  - id: ruff-format
- repo: https://github.com/Yelp/detect-secrets
  rev: v1.5.0
  hooks:
  - id: detect-secrets
    args:
    - --baseline
    - .secrets.baseline
- repo: https://github.com/PyCQA/bandit
  rev: 1.8.3
  hooks:
  - id: bandit
    name: bandit (SAST)
    args:
    - --recursive
    - --skip
    - B101,B104,B105,B106,B107,B108,B110,B310,B404,B602,B603,B606,B607,B608  # CLI tool: subprocess, SQLite, test fixtures, graceful degradation
    - packages/
- repo: local
  hooks:
  - id: no-aws-tokens
    name: Check for AWS tokens
    entry: (?i)(AWS_BEARER_TOKEN\w*|aws_access_key_id|aws_secret_access_key)\s*[=:]\s*["']?[A-Za-z0-9/+=]{20,}
    language: pygrep
    types:
    - text
  # One hook, the same invocation as `just typecheck`, so the commit-time check
  # and the release gate cannot disagree. The previous two hooks ran pyright on
  # each package's src/ only; a test-only type error (R-51) passed the hook and
  # then failed the gate.
  - id: pyright
    name: pyright (workspace, src + tests — same as `just typecheck`)
    language: system
    entry: uv run --group dev pyright
    pass_filenames: false
    files: ^packages/.*\.py$
