# Lane-ownership map for the 2026-09 remediation (M0 item 0.7).
#
# Source of truth for WHY each lane owns what:
#   reviews/2026-09-02-full-repo-review/IMPLEMENTATION-PLAN.md §3 (the six lanes)
#   reviews/2026-09-02-full-repo-review/DECISIONS.md §E3–E5 (the corrections below)
#   reviews/2026-09-02-full-repo-review/briefs/M<n>-lane.md (each lane's file list)
# Every literal path here exists in `git ls-files` at the M0 head except the two
# forward-declared files noted inline. Path corrections to the plan's shorthand
# are in evidence/M0/0.7-lane-ownership/04-map-corrections.md.
#
# Semantics (see tests/_lane_ownership.py): a changed file that matches a
# `shared` pattern is always fine; one that matches this lane's list (alone or
# jointly with other lanes) is fine; one that matches ONLY other lanes' lists
# is a violation; one that matches nothing is "unmapped" and logged, not failed.
# m0 (foundations) is exempt by branch name. Dual ownership is deliberate where
# two lanes touch one file in different regions (DECISIONS.md §E5): the second
# lane to merge rebases and reruns its gate.
#
# Patterns are fnmatch against the repo-root-relative path; `*` crosses `/`.

lanes:
  m1: # ttyd retirement stages 2–7 — owns the deletion manifest (lane/m1-ttyd-stages-2-7)
    # the web trio (index.html + components.js + style.css) and the module tree
    - packages/studyloop/src/studyloop/web/static/index.html
    - packages/studyloop/src/studyloop/web/static/components.js
    - packages/studyloop/src/studyloop/web/static/style.css
    - packages/studyloop/src/studyloop/web/static/js/**
    # server side of the ttyd surface
    - packages/studyloop/src/studyloop/web/routes/terminal_proxy.py
    - packages/studyloop/src/studyloop/session/orchestrator.py
    - packages/studyloop/src/studyloop/session/start.py
    - packages/studyloop/src/studyloop/session/cleanup.py
    - packages/studyloop/src/studyloop/session_state.py
    - packages/studyloop/src/studyloop/web/routes/session/_transport.py
    - packages/studyloop/src/studyloop/web/routes/session/_models.py
    - packages/studyloop/src/studyloop/web/routes/session/_start.py
    - packages/studyloop/src/studyloop/web/routes/session/_ipc.py
    - packages/studyloop/src/studyloop/web/routes/session/_dashboard.py
    - packages/studyloop/src/studyloop/web/services/session_start.py
    # stage 4 headers (R-13, DECISIONS §E1) and stage 5 ttyd_port removal — shared
    # with m4 in DISTINCT regions (§E5)
    - packages/studyloop/src/studyloop/web/app.py
    - packages/studyloop/src/studyloop/settings.py
    # stage 7 comment fix
    - packages/studyloop/src/studyloop/cli/_doctor.py

