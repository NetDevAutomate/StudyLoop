# Explicit branch -> lane key for lanes whose branch name carries no lane id.
# Consulted BEFORE the legacy `lane/m<n>-<slug>` pattern (tests/_lane_ownership.py,
# lane_id_from_branch). A `feat/` branch that is not listed here is not a lane
# branch: the guard logs that and skips, exactly as it does for `main`.
branches:
  feat/module-schema: S
  feat/module-conformance: C
  feat/module-runner: R
  feat/module-mentor-delivery: T
  feat/module-web-labs: W
  feat/module-cluster: K0   # coordinator-granted, K0-review F11
  feat/module-personas: U1  # coordinator-granted, briefs/U1-persona-journeys.md

# Any lane may touch these. Docs and the changelog are shared because plan
# principle 6 requires them to land in the same commit as the code they
# describe (DECISIONS.md §E3); the coordinator resolves adjacent-line CHANGELOG
# conflicts at merge.
shared:
  - packages/*/tests/**
  - tests/**
  - reviews/**
  - docs/**
  - CHANGELOG.md
  - .github/**
  - Justfile
  - .pre-commit-config.yaml
  - .ci-standards.yaml     # forward-declared: created by lane/m0-ci-standards
