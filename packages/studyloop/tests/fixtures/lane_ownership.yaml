# Lane-ownership map for M0 item 0.7 (see
# reviews/2026-09-02-full-repo-review/IMPLEMENTATION-PLAN.md §3 and the M0
# table for the six-lane summary this expands). Every path here was verified
# against `git ls-files` at HEAD (0fdd204); corrections made to the plan's
# shorthand paths are recorded in
# reviews/2026-09-02-full-repo-review/evidence/M0/0.7-lane-ownership/04-map-corrections.md.
#
# m0 (foundations) is exempt by branch name, not by this map -- see
# test_lane_ownership.py's `lane_id_from_branch` handling.
#
# A file may legitimately appear under more than one lane (e.g.
# session/orchestrator.py is m1 during the ttyd-spawn stages and m2
# afterwards; listing it under both means either lane may touch it without
# tripping the guard, which is the simplest model per the task brief --
# "not a precedence rule").
#
# Patterns are matched with fnmatch against the repo-root-relative path, so
# every entry below is written out in full from the repo root (fnmatch's `*`
# already crosses `/`, so `web/static/js/**` and `web/static/js/*` are
# equivalent -- the double star is kept for human readability).

lanes:
  m1: # ttyd + web trio (lane/m1-ttyd-stages-2-7)
    - packages/studyloop/src/studyloop/web/static/index.html
    # CORRECTED: plan said web/static/js/components.js -- the real file has
    # no js/ subdirectory.
    - packages/studyloop/src/studyloop/web/static/components.js
    # CORRECTED: plan said web/static/css/style.css -- the real file has no
    # css/ subdirectory.
    - packages/studyloop/src/studyloop/web/static/style.css
    - packages/studyloop/src/studyloop/web/static/js/**
    - packages/studyloop/src/studyloop/web/routes/terminal_proxy.py
    # Whole file, per the brief -- ttyd spawn is the only concern in it, but
    # the file isn't split, so treat all of it as m1 during M1.
    - packages/studyloop/src/studyloop/session/orchestrator.py
    - packages/studyloop/src/studyloop/web/routes/session/_transport.py
    - packages/studyloop/src/studyloop/web/routes/session/_models.py
    - packages/studyloop/src/studyloop/web/routes/session/_start.py

  m2: # one session authority (lane/m2-session-authority)
    - packages/studyloop/src/studyloop/session/**
    - packages/studyloop/src/studyloop/web/routes/session/**
    # CORRECTED: plan said bare cleanup.py -- the real file is session/cleanup.py,
    # already covered by the session/** glob above; listed explicitly too
    # since the plan named it standalone.
    - packages/studyloop/src/studyloop/session/cleanup.py
    - packages/studyloop/src/studyloop/tmux.py
    - packages/studyloop/src/studyloop/herdr.py

  m3: # data safety (lane/m3-data-safety)
    - packages/agent-session-tools/**
    - packages/studyloop/src/studyloop/history/**
    - packages/studyloop/src/studyloop/review_db.py
    # CORRECTED: plan said bare teachback.py -- the real file is
    # history/teachback.py, already covered by history/** above; listed
    # explicitly too since the plan named it standalone. (cli/_teachback.py
    # is a different file -- the CLI adapter -- and is intentionally NOT
    # listed here; it isn't named in the plan's map.)
    - packages/studyloop/src/studyloop/history/teachback.py
    - packages/studyloop/src/studyloop/content/index.py

  m4: # security hardening (lane/m4-security)
    - packages/studyloop/src/studyloop/__init__.py
    # CORRECTED: plan said bare child_env.py -- the real file is
    # session/child_env.py (also covered by m2's session/** glob; dual
    # ownership is intentional, same pattern as orchestrator.py).
    - packages/studyloop/src/studyloop/session/child_env.py
    - packages/studyloop/src/studyloop/web/app.py
    - packages/studyloop/src/studyloop/learning/practice.py
    - packages/studyloop/src/studyloop/settings.py

  m5: # public contract, packaging, functional UX (lane/m5-contract-packaging)
    - docs/**
    - pyproject.toml
    - packages/studyloop/pyproject.toml
    - packages/agent-session-tools/pyproject.toml
    - THIRD-PARTY-NOTICES.md
    # NOTE: SECURITY.md does not exist yet at HEAD -- forward-declared so the
    # guard is already correct once m5 (or another lane) creates it.
    - SECURITY.md
    - releases/**
    - CHANGELOG.md
    - README.md

  m6: # quality/UX, post-release (lane/m6-quality-ux)
    - packages/studyloop/src/studyloop/web/static/index.html
    - packages/studyloop/src/studyloop/web/static/components.js
    - packages/studyloop/src/studyloop/web/static/style.css
    - packages/studyloop/src/studyloop/web/static/js/**
    - packages/studyloop/src/studyloop/web/routes/terminal_proxy.py
    - packages/studyloop/src/studyloop/history/**

# Any lane may touch these -- shared infrastructure, tests, and process files.
shared:
  - packages/*/tests/**
  - tests/**
  - reviews/**
  - .github/**
  - justfile
  - .pre-commit-config.yaml
  # NOTE: .ci-standards.yaml does not exist yet at HEAD (created by the
  # sibling lane/m0-ci-standards work) -- forward-declared for the same
  # reason as SECURITY.md above.
  - .ci-standards.yaml
