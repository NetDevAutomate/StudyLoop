[project]
name = "studyloop"
version = "2.5.0"
description = "AuDHD-aware study tool with AI Socratic mentoring, spaced repetition, and content pipeline"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
authors = [{name = "Andy Taylor"}]
keywords = ["study", "flashcards", "spaced-repetition", "audhd", "adhd", "socratic", "notebooklm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Education",
    "Topic :: Education",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
content = ["pymupdf>=1.25", "httpx>=0.27", "pydantic>=2"]
bedrock = ["studyloop[content]", "boto3>=1.40"]
notebooklm = ["notebooklm-py>=0.3.4"]
tui = ["textual>=0.80"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.34", "httpx>=0.27", "websockets>=12.0"]
mcp = ["mcp[cli]>=1.0.0"]
all = ["studyloop[content,bedrock,web,notebooklm,tui,mcp]"]

[project.scripts]
studyloop = "studyloop.cli:cli"
studyloop-mcp = "studyloop.mcp.server:main"

[project.urls]
Homepage = "https://github.com/Hookey-Street-Software/StudyLoop"
Repository = "https://github.com/Hookey-Street-Software/StudyLoop"
Issues = "https://github.com/Hookey-Street-Software/StudyLoop/issues"
Documentation = "https://github.com/Hookey-Street-Software/StudyLoop/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studyloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -m 'not integration and not e2e'"
markers = [
    "integration: requires external infrastructure (tmux, real DB, network)",
    "e2e: end-to-end browser tests requiring Playwright + web server",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
extraPaths = ["../agent-session-tools/src"]  # workspace sibling for cross-package imports

[dependency-groups]
dev = [
    "pexpect>=4.9",
    "pytest-asyncio>=1.3.0",
    "pytest-playwright>=0.7.2",
]
