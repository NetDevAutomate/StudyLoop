[project]
name = "studyloop"
version = "2.5.0"
description = "AuDHD-aware study tool with AI Socratic mentoring, spaced repetition, and content pipeline"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
authors = [{name = "Andy Taylor"}]
keywords = ["study", "flashcards", "spaced-repetition", "audhd", "adhd", "socratic", "notebooklm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Education",
    "Topic :: Education",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "pexpect>=4.9",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
content = ["pymupdf>=1.25", "httpx>=0.27", "pydantic>=2"]
bedrock = ["studyloop[content]", "boto3>=1.40"]
notebooklm = ["notebooklm-py>=0.3.4"]
tui = ["textual>=0.80"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.34", "httpx>=0.27", "websockets>=12.0", "cryptography>=42.0"]
mcp = ["mcp[cli]>=1.0.0"]
# The session DB (cross-harness knowledge base) lives in the sibling
# agent-session-tools workspace package. Declaring it as an extra means a
# plain `uv tool install studyloop[sessions]` pulls it in, so the studyloop
# tool venv can import agent_session_tools and `studyloop doctor` sees the
# sessions DB. Resolved from the workspace via [tool.uv.sources] below.
sessions = ["agent-session-tools"]
all = ["studyloop[content,bedrock,web,notebooklm,tui,mcp,sessions]"]

[tool.uv.sources]
agent-session-tools = { workspace = true }

[project.scripts]
studyloop = "studyloop.cli:cli"
studyloop-mcp = "studyloop.mcp.server:main"
# e2e-harness stand-in agent; inert unless STUDYLOOP_TEST_AGENT=1 registers
# the 'fake' adapter that launches it.
studyloop-fake-agent = "studyloop.testing.fake_agent:main"

[project.urls]
Homepage = "https://github.com/Hookey-Street-Software/StudyLoop"
Repository = "https://github.com/Hookey-Street-Software/StudyLoop"
Issues = "https://github.com/Hookey-Street-Software/StudyLoop/issues"
Documentation = "https://github.com/Hookey-Street-Software/StudyLoop/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studyloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -m 'not integration and not e2e and not live_kiro and not live_provider'"
# MUST be duplicated from the workspace-root pyproject.toml. pytest resolves
# rootdir from its arguments, so `pytest packages/studyloop/tests/foo.py` makes
# THIS file the configfile and the root one is never read -- the root setting
# only ever applied to a bare `pytest` at the workspace root. Two sub-agents
# lost a 30-minute budget each to an unbounded path-scoped run before this was
# spotted, so keep the two in step.
#
# "signal" (SIGALRM) rather than "thread": the hang being guarded against is a
# blocked selector inside a TestClient WebSocket receive, which a timer thread
# cannot interrupt.
timeout = 60
timeout_method = "signal"
markers = [
    "integration: requires external infrastructure (tmux, real DB, network)",
    "e2e: end-to-end browser tests requiring Playwright + web server",
    "live_kiro: dogfood tests that spawn a real kiro-cli acp child (requires Kiro auth + network; opt in with -m live_kiro)",
    "live_provider: tests that call a real LLM provider (OpenAI/OpenRouter/Gemini/MiniMax/Anthropic). Burns API quota; opt in with -m live_provider",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
extraPaths = ["../agent-session-tools/src"]  # workspace sibling for cross-package imports

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "pytest-playwright>=0.7.2",
    "respx>=0.23.1",
]
