[project]
name = "studyloop"
version = "0.2.0"
description = "AuDHD-aware study tool with AI Socratic mentoring, spaced repetition, and content pipeline"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
authors = [{name = "Andy Taylor"}]
keywords = ["study", "flashcards", "spaced-repetition", "audhd", "adhd", "socratic", "notebooklm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Education",
    "Topic :: Education",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "pexpect>=4.9",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
content = ["pymupdf>=1.25", "httpx>=0.27", "pydantic>=2"]
bedrock = ["studyloop[content]", "boto3>=1.40"]
notebooklm = ["notebooklm-py>=0.3.4"]
tui = ["textual>=0.80"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.34", "httpx>=0.27", "websockets>=12.0", "cryptography>=42.0"]
mcp = ["mcp[cli]>=1.0.0,<2"]
# There is deliberately no `sessions` extra. `agent-session-tools` (the
# session DB / cross-harness knowledge base) is not published anywhere, so
# `[tool.uv.sources] workspace = true` -- the only thing that ever made
# `studyloop[sessions]` resolve -- worked inside this repo's own uv workspace
# and nowhere else: a wheel built with `--no-sources`, or any install of a
# hypothetical future PyPI release, advertised a dependency that could never
# install (REPORT.md R-29 / F-02).
#
# Instead, `agent-session-tools` is a HARD dependency of the source-install
# path (DECISIONS.md B1): `install_workspace_tools()` in `installers.py`
# passes `--with-editable <agent-session-tools path>` unconditionally when
# installing the `studyloop` tool, independent of any extra. A source
# checkout always gets it; a bare wheel install never advertises it.
all = ["studyloop[content,bedrock,web,notebooklm,tui,mcp]"]

[project.scripts]
studyloop = "studyloop.cli:cli"
studyloop-mcp = "studyloop.mcp.server:main"

[project.urls]
Homepage = "https://www.studyloop.dev/"
Repository = "https://github.com/NetDevAutomate/StudyLoop"
Issues = "https://github.com/NetDevAutomate/StudyLoop/issues"
Documentation = "https://github.com/NetDevAutomate/StudyLoop/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studyloop"]
# Dev-only vendored assets are tracked in git -- a developer needs them on every
# machine they check out on -- but must not reach users, who never run --dev.
# See docs/adr/0007-dev-only-vendored-assets.md.
#
# The boundary is a DIRECTORY, not a filename glob, on purpose. This repo has
# twice been bitten by name-based rules that outlived their intent: a bare `lib/`
# in .gitignore silently untracked two production modules, and a blanket
# `*.wasm` swept a 423 KB file into Git LFS and broke three CI jobs. A glob would
# silently ship the NEXT dev-only asset; a directory whose name states the
# contract cannot drift.
#
# Enforced both ways by tests/test_dev_asset_packaging.py: the wheel must not
# contain these files, and the repo must.
exclude = ["src/studyloop/web/static/vendor/dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -m 'not integration and not e2e and not live_kiro and not live_provider and not live_obsidian'"
# MUST be duplicated from the workspace-root pyproject.toml. pytest resolves
# rootdir from its arguments, so `pytest packages/studyloop/tests/foo.py` makes
# THIS file the configfile and the root one is never read -- the root setting
# only ever applied to a bare `pytest` at the workspace root. Two sub-agents
# lost a 30-minute budget each to an unbounded path-scoped run before this was
# spotted, so keep the two in step.
#
# "signal" (SIGALRM) rather than "thread": the hang being guarded against is a
# blocked selector inside a TestClient WebSocket receive, which a timer thread
# cannot interrupt.
timeout = 60
timeout_method = "signal"
markers = [
    "integration: requires external infrastructure (tmux, real DB, network)",
    "e2e: end-to-end browser tests requiring Playwright + web server",
    "live_kiro: dogfood tests that spawn a real kiro-cli acp child (requires Kiro auth + network; opt in with -m live_kiro)",
    "live_provider: tests that call a real LLM provider (OpenAI/OpenRouter/Gemini/MiniMax/Anthropic). Burns API quota; opt in with -m live_provider",
    "live_obsidian: tests that write into a dedicated throwaway Obsidian vault on the owner's machine and read the notes back (opt in with -m live_obsidian)",
    "allow_server_errors: test deliberately drives the server into an unhandled exception, so the per-test server-log check is skipped for it",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
extraPaths = ["../agent-session-tools/src"]  # workspace sibling for cross-package imports

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "pytest-playwright>=0.7.2",
    "respx>=0.23.1",
]
