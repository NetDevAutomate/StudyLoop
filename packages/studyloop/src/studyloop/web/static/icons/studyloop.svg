<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="55%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <radialGradient id="dotA" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>
    <radialGradient id="dotB" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#FBCFE8"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </radialGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Soft inner border -->
  <rect x="20" y="20" width="472" height="472" rx="96" ry="96" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- Infinity loop: study + cycle metaphor -->
  <g transform="translate(256 256)">
    <path d="
      M -130 0
      C -130 -80, -45 -80, 0 0
      C 45 80, 130 80, 130 0
      C 130 -80, 45 -80, 0 0
      C -45 80, -130 80, -130 0 Z"
      fill="none" stroke="url(#loop)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Two travelling nodes — agentic pulses on the loop -->
    <circle cx="-130" cy="0" r="18" fill="url(#dotB)"/>
    <circle cx="130" cy="0" r="18" fill="url(#dotA)"/>

    <!-- Tiny center spark where the loops cross -->
    <circle cx="0" cy="0" r="9" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="5" fill="#7C3AED"/>
  </g>
</svg>
